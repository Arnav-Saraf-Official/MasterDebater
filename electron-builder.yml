directories:
  output: dist

asar: false

files:
  - build/**/*
  - dist-electron/**/*
  - package.json

publish:
  provider: github
  owner: Arnav-Saraf-Official
  repo: MasterDebater

win:
  target:
    - nsis
    - portable
  icon: static/icon.png
  arch:
    - x64

mac:
  target:
    - dmg
    - zip
  icon: static/icon.icns

linux:
  target: AppImage
  icon: static/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
