directories:
  output: release

asar: false

files:
  - build/**/*
  - dist-electron/main.cjs
  - dist-electron/main.cjs.map
  - dist-electron/preload.cjs
  - dist-electron/preload.cjs.map
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: static/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
    - target: dir
      arch:
        - x64
        - arm64
  icon: static/icon.icns

linux:
  target: AppImage
  icon: static/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
