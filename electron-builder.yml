directories:
  output: dist

afterPack: electron/afterPack.mjs

asar: false

files:
  - build/**/*
  - dist-electron/**/*
  - package.json

publish:
  provider: github
  owner: Arnav-Saraf-Official
  repo: MasterDebater

win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  icon: static/icon.png

mac:
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: static/icon.icns

linux:
  target: AppImage
  icon: static/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
